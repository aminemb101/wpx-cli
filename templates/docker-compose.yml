services:

  wpx-php:
    container_name: "${COMPOSE_PROJECT_NAME}-wpx-php"
    build: 
      context: './dockerfiles/php'
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    volumes:
      - '..:/var/www/html'
      - './php-conf:/usr/local/etc/php'
    dns:
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"  
    pre_start:
      - command:
          - sh
          - -c
          - |
            if [ -z "$$(ls -A /usr/local/etc/php)" ]; then
              cp -a /usr/local/etc/php-defaults/. /usr/local/etc/php/
              mkdir -p /usr/local/etc/php/conf.d
              echo "memory_limit = 512M" >> /usr/local/etc/php/conf.d/docker-fpm.ini
              chown -R ${USER_UID:-1000}:${USER_GID:-1000} /usr/local/etc/php
            fi

  wpx-nginx:
    container_name: "${COMPOSE_PROJECT_NAME}-wpx-nginx"
    build: './dockerfiles/nginx'
    volumes:
      - '../:/var/www/html'
      - './vhosts:/etc/nginx/conf.d'
    networks:
      - wpx-proxy
      - default
    depends_on:
      - wpx-php
    environment:
      - VIRTUAL_HOST=${HOST_NAME}
   
    
  wpx-mariadb:
    container_name: "${COMPOSE_PROJECT_NAME}-wpx-mariadb"
    image: yobasystems/alpine-mariadb
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/mysqld/mysqld.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - "wpx-db:/var/lib/mysql"
    
networks:
  wpx-proxy:
    external: true
  
volumes: 
  wpx-db:
